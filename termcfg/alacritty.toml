[font]
normal = { family = "SF Mono", style = "Regular" }
bold = { family = "SF Mono", style = "Regular" }
italic = { family = "SF Mono", style = "Italic" }
bold_italic = { family = "SF Mono", style = "Italic" }
size = 12.0
offset = { x = 0, y = 8 }

[colors.primary]
background = "0x282c34"
foreground = "0xdcdfe4"

[colors.normal]
black = "0x282c34"
red = "0xe06c75"
green = "0x98c379"
yellow = "0xe5c07b"
blue = "0x61afef"
magenta = "0xc678dd"
cyan = "0x56b6c2"
white = "0xdcdfe4"

[colors.bright]
black = "0x282c34"
red = "0xe06c75"
green = "0x98c379"
yellow = "0xe5c07b"
blue = "0x61afef"
magenta = "0xc678dd"
cyan = "0x56b6c2"
white = "0xdcdfe4"

[cursor]
style = "Underline"
thickness = 0.5

[window]
startup_mode = "Maximized"
title = "Windows"
padding = {x = 6, y = 6}
dynamic_padding = true

[terminal]
